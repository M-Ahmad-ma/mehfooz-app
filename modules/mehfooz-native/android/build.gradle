plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mehfooznative'
version = '0.1.0'

android {
  namespace "expo.modules.mehfooznative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "com.google.mlkit:text-recognition:16.0.1"
  implementation "cz.adaptech.tesseract4android:tesseract4android:4.9.0"
}
